<style>
  :root{
    --ink:#25244A; --ink-soft:#5B5A78; --ink-faint:#9696AD;
    --paper:#F5F5F9; --card:#FFFFFF; --line:#E3E3EC; --line-soft:#F1F1F6;
    --accent:#F68633; --accent-deep:#E5711C; --accent-tint:#FEF0E6;
    --green:#16A34A; --green-bg:#EAF7EE; --green-line:#BBE6C8;
    --red:#E24B4A; --red-bg:#FBEAE4; --red-line:#F6C9BC;
    --amber:#B45309; --amber-bg:#FFF7E8; --amber-line:#FAD89A; --amber-dot:#F59E0B;
    --blue:#2563EB;
    --plug-blue:#3B3972; --plug-blue-deep:#2E2C5E; --plug-blue-tint:#ECEBF4;
    --r:14px; --r-sm:9px;
    --shadow:0 1px 2px rgba(27,27,32,.03), 0 4px 18px rgba(27,27,32,.05);
    --shadow-lg:0 12px 44px rgba(27,27,32,.13);
    --font:'Exo', system-ui, -apple-system, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--font);background:var(--paper);color:var(--ink);line-height:1.5}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  a{color:inherit}
  ::selection{background:var(--accent-tint);color:var(--accent-deep)}

  /* ---------- atoms ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:var(--r-sm);
    font-size:13.5px;font-weight:600;padding:10px 16px;transition:.15s;white-space:nowrap}
  .btn-primary{background:var(--ink);color:#fff}
  .btn-primary:hover{background:#000}
  .btn-accent{background:var(--accent);color:#fff}
  .btn-plugblue{background:var(--plug-blue);color:#fff} .btn-plugblue:hover{background:var(--plug-blue-deep)}
  .btn-accent:hover{background:var(--accent-deep)}
  .btn-ghost{background:#fff;color:var(--ink-soft);border:1px solid var(--line)}
  .btn-ghost:hover{background:var(--line-soft);color:var(--ink)}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:7px}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn-wa{background:#25D366;color:#fff} .btn-wa:hover{background:#1eae54}
  .btn-wa-outline{background:#fff;color:var(--plug-blue);border:1.5px solid var(--plug-blue)} .btn-wa-outline:hover{background:var(--plug-blue-tint)}
  .icon-btn{width:33px;height:33px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink-soft);
    display:inline-flex;align-items:center;justify-content:center;font-size:15px;transition:.15s}
  .icon-btn:hover{background:var(--line-soft);color:var(--ink)}

  .field{margin-bottom:15px}
  .field label{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:var(--r-sm);
    font-size:14px;color:var(--ink);background:#fff;transition:.15s}
  .field textarea{resize:vertical;min-height:90px;line-height:1.6}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint)}
  .field .hint{font-size:12px;color:var(--ink-faint);margin-top:5px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:13px}

  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:600}
  .chip-accent{background:var(--accent-tint);color:var(--accent-deep)}
  .chip-ink{background:#EFECE5;color:var(--ink-soft)}
  .sb{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:99px;font-size:11.5px;font-weight:700;white-space:nowrap}
  .sb.pending{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-line)}
  .sb.approved{background:var(--green-bg);color:var(--green);border:1px solid var(--green-line)}
  .sb.rejected{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line)}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
    padding:13px 22px;border-radius:10px;font-size:13.5px;font-weight:500;opacity:0;transition:.3s;z-index:900;pointer-events:none;box-shadow:var(--shadow-lg);max-width:90vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .modal-bg{position:fixed;inset:0;background:rgba(27,27,32,.4);backdrop-filter:blur(3px);z-index:800;display:none;
    align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
  .modal-bg.show{display:flex}
  .modal{background:var(--card);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;
    animation:pop .22s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  .modal-head{padding:20px 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-head h3{font-size:19px;font-weight:700;letter-spacing:-.01em}
  .modal-body{padding:22px 24px}
  .modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;background:var(--line-soft);border-radius:0 0 18px 18px}

  .logo{font-weight:800;letter-spacing:-.03em;line-height:1}
  .logo .dot{color:var(--accent)}
  .gate-card .logo{font-size:30px;margin-bottom:6px}
  .gate-card .tag{font-size:9.5px;font-weight:700;letter-spacing:.16em;color:var(--ink-faint);margin-bottom:24px}
  .gate-tabs{display:flex;gap:6px;background:var(--line-soft);padding:5px;border-radius:11px;margin-bottom:22px}
  .gate-tab{flex:1;padding:9px;border:none;background:transparent;border-radius:8px;font-weight:600;font-size:13px;color:var(--ink-soft);transition:.15s}
  .gate-tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

  /* ---------- agency shell: sidebar ---------- */
  .layout{display:flex;min-height:100vh}
  .side{width:230px;flex-shrink:0;background:#fff;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
  .side .logo{font-size:21px;text-align:left;padding:2px 8px}
  .side .tag{font-size:8.5px;font-weight:700;letter-spacing:.14em;color:var(--ink-faint);padding:2px 8px 0}
  .nav-sec{font-size:9px;font-weight:700;letter-spacing:.13em;color:#BBB7AE;padding:18px 10px 6px}
  .nav-item{display:flex;align-items:center;gap:11px;color:var(--ink-soft);padding:10px 12px;border-radius:9px;font-size:13.5px;font-weight:500;transition:.13s;cursor:pointer;border:none;background:none;width:100%;text-align:left}
  .nav-item:hover{background:var(--line-soft);color:var(--ink)}
  .nav-item.active{background:var(--accent);color:#fff;font-weight:600}
  .nav-item .ic{font-size:17px;width:18px;text-align:center;flex-shrink:0}
  .nav-item .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .nav-item.active .badge{background:rgba(255,255,255,.25)}
  .side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 8px 4px;border-top:1px solid var(--line);margin-top:auto}
  .side-foot .av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
  .side-foot .nm{font-size:12.5px;font-weight:700;line-height:1.3}
  .side-foot .rl{font-size:11px;color:var(--ink-faint)}
  .side{background:var(--plug-blue-deep);border-right:none}
  .side .tag, .side .nav-sec{color:rgba(255,255,255,.5)}
  .side .nav-item{color:rgba(255,255,255,.78)}
  .side .nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
  .side .side-foot{border-top-color:rgba(255,255,255,.1)}
  .side-sair{background:none;border:none;color:rgba(255,255,255,.6);font-size:12px;padding:8px;border-radius:8px;margin-top:4px}
  .side-sair:hover{color:#fff;background:rgba(255,255,255,.08)}
  .side .side-foot .nm{color:#fff} .side .side-foot .rl{color:rgba(255,255,255,.6)}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{display:none}
  .content{flex:1;padding:30px 36px 80px;max-width:1120px;width:100%}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
  .page-head h2{font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .page-head p{color:var(--ink-soft);font-size:13.5px;margin-top:4px}
  .crumb{font-size:13px;color:var(--ink-faint);margin-bottom:7px}
  .crumb a{cursor:pointer} .crumb a:hover{color:var(--accent);text-decoration:underline} .crumb b{color:var(--ink)}

  /* metric cards */
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:22px}
  .stat{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
  .stat .bar{height:3px}
  .stat .in{padding:15px 17px}
  .stat .lbl{font-size:9.5px;font-weight:700;letter-spacing:.09em;color:var(--ink-faint)}
  .stat .num{font-size:27px;font-weight:800;margin:5px 0 2px;letter-spacing:-.02em}
  .stat .desc{font-size:11.5px;color:var(--ink-faint)}

  /* grid cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .ccard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px;
    transition:.16s;cursor:pointer;position:relative;overflow:hidden}
  .ccard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:var(--ink-faint)}
  .ccard .swatch{position:absolute;top:0;left:0;right:0;height:4px}
  .ccard .cinit{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:17px;margin-bottom:13px}
  .ccard h3{font-size:16px;font-weight:700;letter-spacing:-.01em;margin-bottom:3px}
  .ccard .meta{font-size:12.5px;color:var(--ink-soft)}
  .ccard .foot{display:flex;align-items:center;gap:7px;margin-top:14px;flex-wrap:wrap}
  .minibar{height:6px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-top:13px}
  .minibar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
  .add-card{border:2px dashed var(--line);border-radius:var(--r);background:transparent;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:8px;color:var(--ink-faint);font-weight:600;font-size:13.5px;min-height:150px;transition:.16s}
  .add-card:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-tint)}
  .add-card .pl{font-size:26px;line-height:1}

  .empty{text-align:center;padding:64px 20px;color:var(--ink-faint)}
  .empty .em{font-size:38px;margin-bottom:12px;opacity:.6}
  .empty h3{font-size:19px;color:var(--ink-soft);font-weight:700;margin-bottom:6px}

  .secbar{display:flex;align-items:center;gap:11px;margin:30px 0 15px}
  .secbar .ico{width:34px;height:34px;border-radius:9px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
  .secbar h3{font-size:18px;font-weight:700}
  .secbar .spacer{flex:1}

  .tcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead th{background:var(--ink);color:#fff;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:11px 15px;text-align:left}
  tbody td{padding:12px 15px;font-size:13px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:var(--line-soft)}
  .pnum{width:25px;height:25px;border-radius:7px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}

  .item-ed{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:15px;overflow:hidden}
  .item-ed-head{display:flex;align-items:center;gap:11px;padding:14px 17px;background:var(--line-soft);border-bottom:1px solid var(--line)}
  .item-ed-head .t{flex:1;font-weight:700;font-size:14.5px}
  .item-ed-body{padding:17px}
  .toggle-row{display:flex;gap:18px;margin-top:4px;flex-wrap:wrap}
  .tg{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-soft)}
  .tg input{width:17px;height:17px;accent-color:var(--accent)}
  .creative-prev{margin-top:10px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#16161a;min-height:120px;display:flex;align-items:center;justify-content:center}
  .creative-prev img{width:100%;max-height:320px;object-fit:contain;display:block}
  .creative-prev video{width:100%;max-height:360px;display:block;background:#000}
  .creative-prev .none{color:rgba(255,255,255,.4);font-size:13px;padding:30px;text-align:center}

  .track-row{display:flex;align-items:flex-start;gap:13px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
  /* tracking estruturado (semana/post) para tela e PDF */
  .tk-doc{display:flex;flex-direction:column;gap:16px}
  .tk-doc-title{font-size:19px;font-weight:800;margin-bottom:4px}
  .no-screen{display:none}
  .tk-week{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;break-inside:avoid}
  .tk-week-h{display:flex;align-items:center;gap:9px;background:var(--line-soft);padding:12px 18px;font-size:15px;border-bottom:1px solid var(--line)}
  .tk-week-h b{font-size:15px}
  .tk-post{padding:16px 18px;border-bottom:1px solid var(--line-soft);break-inside:avoid}
  .tk-post:last-child{border-bottom:none}
  .tk-post-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .tk-num{width:24px;height:24px;border-radius:7px;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
  .tk-title{font-size:15px;font-weight:700;color:var(--ink)}
  .tk-meta{font-size:12.5px;font-weight:600;color:var(--accent);background:var(--accent-tint);padding:2px 9px;border-radius:20px}
  .tk-desc{white-space:pre-wrap;font-size:13.5px;line-height:1.62;color:var(--ink);background:#fff;border-left:3px solid var(--line);padding:4px 0 4px 14px;margin:6px 0 0}

  const first=new Date(y,mo,1).getDay();
  const days=new Date(y,mo+1,0).getDate();
  const years=[]; const cy=new Date().getFullYear(); for(let i=cy-1;i<=cy+2;i++) years.push(i);
  let cells='';
  for(let i=0;i<first;i++) cells+=`<button class="cal-day empty"></button>`;
  for(let d=1;d<=days;d++){ const sel=(y===selY&&mo===selM&&d===selD); cells+=`<button class="cal-day ${sel?'sel':''}" onclick="pickDay(${d})">${d}</button>`; }
  pop.innerHTML=`
    <div class="cal-head">
      <button class="cal-nav" onclick="calMove(-1)">‹</button>
      <div style="display:flex;gap:5px">
        <select onchange="calSet('mo',this.value)">${MONTHS_PT.map((m,i)=>`<option value="${i}" ${i===mo?'selected':''}>${m}</option>`).join('')}</select>
        <select onchange="calSet('y',this.value)">${years.map(yy=>`<option value="${yy}" ${yy===y?'selected':''}>${yy}</option>`).join('')}</select>
      </div>
      <button class="cal-nav" onclick="calMove(1)">›</button>
    </div>
    <div class="cal-grid">${DOW_PT.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
    <div class="cal-foot"><button class="clr" onclick="pickDay(0)">Limpar</button><button class="tdy" onclick="calToday()">Hoje</button></div>`;
}
function calMove(d){ let {y,mo}=_calYM; mo+=d; if(mo<0){mo=11;y--;} if(mo>11){mo=0;y++;} _calYM={y,mo}; drawCal(); }
function calSet(k,v){ _calYM[k]=+v; drawCal(); }
function calToday(){ const n=new Date(); _calYM={y:n.getFullYear(),mo:n.getMonth()}; drawCal(); }
async function pickDay(d){
  const it=S._items.find(x=>x.id===_calItem); const id=_calItem;
  let iso='';
  if(d>0){ const {y,mo}=_calYM; iso=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
  if(it) it.post_date=iso;
  closeCal();
  // atualiza o botão sem re-renderizar tudo
  const btn=$('dbtn-'+id);
  if(btn){ btn.innerHTML='📅 '+(iso?fmtDate(iso):'Escolher data'); btn.classList.toggle('empty',!iso); }
  await sb.from('items').update({post_date:iso||null}).eq('id',id);
}

function getParams(){
  const out={};
  try{ new URLSearchParams(location.search).forEach((v,k)=>out[k]=v); }catch(e){}
  try{ const h=location.hash.replace(/^#\/?\??/,''); if(h){ // formato #/c/TOKEN ou #/c/TOKEN/p/PROJECTID (link de uma tarefa só)
      const m=h.match(/^c\/([A-Za-z0-9]+)(?:\/p\/([A-Za-z0-9-]+))?/); if(m){ out.c=m[1]; if(m[2]) out.p=m[2]; }
      new URLSearchParams(h).forEach((v,k)=>{ if(!out[k]) out[k]=v; });
    } }catch(e){}
  return out;
}

async function boot(){
  if(!window.supabase){ $('app').innerHTML=`<div class="gate"><div class="gate-card"><div class="marca-plug" role="img" aria-label="Plug Comunicação" style="width:180px;margin:0 auto 8px"></div><p style="margin-top:14px;color:var(--red)">Não foi possível carregar a biblioteca do Supabase. Verifique a conexão e recarregue.</p></div></div>`; return; }
  const p=getParams();
  if(p.c){ return enterClient(p.c,p.p); }       // link do cliente (p.p = tarefa específica, se houver)
  const { data:{ session } } = await clienteEquipe().auth.getSession();
  if(session){ connectAgency(); return renderDashboard(); }
  const linkSalvo=lerLocal('aprova_link_cliente');
  if(emApp() && linkSalvo && linkSalvo!==location.href){
    const destino=new URL(linkSalvo);
    if(destino.pathname+destino.search===location.pathname+location.search){ history.replaceState(null,'',linkSalvo); return boot(); }
    location.replace(linkSalvo); return;
  }
  renderLanding();
}

async function loadAll(){
  if(AVISOS_LIGADOS && MODE==='agency') setTimeout(atualizarSininho, 800);
  const { data:clients, error:e1 } = await sb.from('clients').select('*').order('created_at');
  if(e1){ toast('Erro ao carregar clientes'); console.error(e1); return false; }
  const { data:projects } = await sb.from('projects').select('*').order('created_at');
  S.clients = clients||[]; S.projects = projects||[];
  try{ const { data:ag } = await sb.from('agency').select('*').eq('id',1).maybeSingle(); if(ag){ S.agency=ag; CFG.agencyName=ag.name||CFG.agencyName; } }catch(e){}
  return true;
}
async function projectStats(projectId){
  const p=S.projects.find(x=>x.id===projectId);
  // MENSAL: a "unidade" de aprovação é o mês inteiro + comentários contam como ajustes
  if(p&&p.mode==='mensal'){
    const { data:items } = await sb.from('items').select('id,note,row_type,post_status').eq('project_id',projectId);
    const posts=(items||[]).filter(i=>i.row_type!=='week');
    const appr=posts.filter(i=>i.post_status==='approved').length;
    const rej=posts.filter(i=>i.post_status==='rejected').length;
    const done=appr+rej;
    return {total:posts.length, done, appr, rej, monthly:true};
  }
  // SEMANAL: conta itens e decisões
  const { data:items } = await sb.from('items').select('id,has_copy,has_creative').eq('project_id',projectId);
  if(!items||!items.length) return {total:0,done:0,appr:0,rej:0};
  const ids=items.map(i=>i.id);
  const { data:decs } = await sb.from('decisions').select('item_id,kind,status').in('item_id',ids);
  let total=0; items.forEach(i=>{ if(i.has_copy)total++; if(i.has_creative)total++; });
  let done=0,appr=0,rej=0; (decs||[]).forEach(d=>{ done++; if(d.status==='approved')appr++; else if(d.status==='rejected')rej++; });
  return {total,done,appr,rej};
}

/* ---------- DASHBOARD ---------- */
async function renderDashboard(){
  S.view='dash';
  shell(`<div class="loading"><div class="spin"></div><p>Carregando painel…</p></div>`);
  if(!await loadAll()) return;

  // agrega métricas
  let activeClients=S.clients.length, pend=0, appr=0, rej=0;
  for(const p of S.projects){
    const st=await projectStats(p.id);
    // só conta como "aguardando" o que está publicado (já foi pro cliente)
    if(p.published) pend += (st.total-st.done);
    appr+=st.appr; rej+=st.rej;
  }
  // aprovações recentes: decisões (semanal) + status de mês (mensal), unificadas por data
  const recent=[];
  const { data:recentDecs } = await sb.from('decisions').select('*').order('updated_at',{ascending:false}).limit(8);
  for(const d of (recentDecs||[])){
    const { data:it } = await sb.from('items').select('title,project_id').eq('id',d.item_id).single();
    let cname='', ccolor='#999';
    if(it){ const pr=S.projects.find(x=>x.id===it.project_id); const cl=pr&&S.clients.find(x=>x.id===pr.client_id); if(cl){cname=cl.name;ccolor=cl.color;} }
    recent.push({ when:d.updated_at||'', cname, ccolor, label:(it?it.title:'(item)')+' · '+(d.kind==='copy'?'Copy':'Criativo'), status:d.status });
  }
  // mensais e projetos: usar o status real por post (post_status), não o month_status antigo
  for(const p of S.projects){
    if((p.mode==='mensal') && p.month_ts){
      const cl=S.clients.find(x=>x.id===p.client_id);
      const { data:its }=await sb.from('items').select('row_type,post_status').eq('project_id',p.id);
      const posts=(its||[]).filter(i=>i.row_type!=='week');
      const ap=posts.filter(i=>i.post_status==='approved').length;
      const rj=posts.filter(i=>i.post_status==='rejected').length;
      if(ap+rj===0) continue; // ainda não avaliado, não mostra
      const allApproved = rj===0 && ap===posts.length;
      const label = p.title+' · '+(allApproved?'Mês aprovado':`${ap}✓ / ${rj}✕`);
      recent.push({ when:p.month_ts, cname:cl?cl.name:'', ccolor:cl?cl.color:'#999', label, status:allApproved?'approved':'rejected', monthly:true });
    }
  }
  recent.sort((a,b)=> (b.when||'').localeCompare(a.when||''));
  const recentTop=recent.slice(0,6);
  S._pendCount=pend;

  const stat=(bar,lbl,num,desc)=>`<div class="stat"><div class="bar" style="background:${bar}"></div><div class="in"><div class="lbl">${lbl}</div><div class="num">${num}</div><div class="desc">${desc}</div></div></div>`;

  let recentRows='';
  if(recentTop.length){
    for(const r of recentTop){
      const ok=r.status==='approved';
      const stLabel = r.monthly ? (ok?'✓ Aprovado':'◑ Parcial/Revisão') : (ok?'✓ Aprovado':'✕ Ajuste');
      recentRows+=`<div style="display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line-soft)">
        <div style="width:26px;height:26px;border-radius:7px;background:${r.ccolor};color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700">${esc((r.cname||'?').slice(0,2).toUpperCase())}</div>
        <div style="font-size:12.5px;flex:1">${esc(r.cname)} · <span style="color:var(--ink-faint)">${esc(r.label)}</span></div>
        <span class="sb ${ok?'approved':'rejected'}">${stLabel}</span></div>`;
    }
  } else { recentRows=`<div style="padding:16px 0;color:var(--ink-faint);font-size:13px">Nenhuma resposta ainda. Publique uma tarefa e envie o link ao cliente.</div>`; }

  const body=`
    <div class="page-head"><div><h2>Dashboard</h2><p>Visão geral das aprovações de todos os clientes.</p></div>
      <button class="btn btn-accent" onclick="editClient()">＋ Novo cliente</button></div>
    <div class="stats">
      ${stat('var(--accent)','CLIENTES ATIVOS',activeClients,'Cadastrados no sistema')}
      ${stat('var(--amber-dot)','AGUARDANDO APROVAÇÃO',pend,'Pendentes do cliente (semanal + mês)')}
      ${stat('var(--green)','APROVADOS',appr,'Liberados para publicar')}
      ${stat('var(--red)','AJUSTES PEDIDOS',rej,'Reprovados com observação')}
    </div>
    <div class="tcard" style="padding:17px 20px">
      <div style="display:flex;align-items:center;justify-content:space-between"><div style="font-size:14px;font-weight:700">Aprovações recentes</div>
      <span style="font-size:12.5px;font-weight:600;color:var(--accent);cursor:pointer" onclick="nav('clients')">Ver clientes →</span></div>
      ${recentRows}
    </div>`;
  shell(body);
}

function uploadClientLogo(input){
  const f=input.files&&input.files[0]; if(!f)return;
  if(!f.type.startsWith('image/')) return toast('Selecione uma imagem');
  const r=new FileReader();
  r.onload=e=>{ const img=new Image();
    img.onload=()=>{ const sz=256; const cv=document.createElement('canvas'); cv.width=sz; cv.height=sz;
      const ctx=cv.getContext('2d'); const m=Math.min(img.width,img.height); const sx=(img.width-m)/2, sy=(img.height-m)/2;
      ctx.drawImage(img,sx,sy,m,m,0,0,sz,sz);
      let data=cv.toDataURL('image/jpeg',0.85);
      if(data.length>180000) data=cv.toDataURL('image/jpeg',0.6);
      S._clientLogoTmp=data;
      const prev=$('cLogoPrev'); if(prev) prev.innerHTML=`<img src="${data}" style="width:100%;height:100%;object-fit:cover">`;
      toast('Logo carregada — clique em Salvar');
    };
    img.src=e.target.result; };
  r.readAsDataURL(f);
}
function removeClientLogo(){ S._clientLogoTmp=''; const prev=$('cLogoPrev'); if(prev) prev.innerHTML=esc(($('cInit')&&$('cInit').value||$('cName')&&$('cName').value||'?').slice(0,2).toUpperCase()); toast('Logo removida — clique em Salvar'); }
function pickColor(c){ $('cColor').value=c; document.querySelectorAll('.swcolor').forEach(b=>b.style.borderColor=(b.dataset.c===c?'var(--ink)':'transparent')); const prev=$('cLogoPrev'); if(prev&&!S._clientLogoTmp) prev.style.background=c; }
async function saveClient(id){

  const rec={ name, initials:($('cInit').value.trim()||name.slice(0,2)).toUpperCase(), contact:$('cContact').value.trim(), color:$('cColor').value, pin:$('cPin').value.trim()||null, logo:S._clientLogoTmp||null, whatsapp_cliente:$('cWa').value.replace(/\D/g,'')||null };
  let res;
  if(id){ res=await sb.from('clients').update(rec).eq('id',id); }

function enviarAoCliente(pid){
  const p=S.projects.find(x=>x.id===pid); const c=p&&S.clients.find(x=>x.id===p.client_id); if(!p||!c) return;
  const link=projectLinkFor(c,p);
  const msg=`Olá! 😊 Os conteúdos de *${p.title||c.name}* estão prontos para sua aprovação:\n👉 ${link}\n\nAprove ou peça ajustes direto pelo link. Qualquer dúvida, estamos por aqui!\nEquipe Plug Comunicação`;
  let fone=(c.whatsapp_cliente||'').replace(/\D/g,''); if(fone && fone.length<=11) fone='55'+fone;
  // abre o WhatsApp já no clique (depois de esperar o banco, o navegador bloquearia a janela)
  window.open(`https://wa.me/${fone}?text=${encodeURIComponent(msg)}`,'_blank');
  (async()=>{
    if(!p.published){
      const { error }=await sb.from('projects').update({published:true}).eq('id',pid);

  })();

async function saveProject(id,clientId){

async function renderProject(projectId){
  S.view='clients'; S.projectId=projectId;
  shell(`<div class="loading"><div class="spin"></div><p>Carregando tarefa…</p></div>`);
  await loadAll();
  const p=S.projects.find(x=>x.id===projectId); if(!p) return renderClients();
  const c=S.clients.find(x=>x.id===p.client_id);
  const isMonthly=(p.mode==='mensal') || (!p.mode && p.kind==='Mensal');
  const isProject=(p.mode==='projeto');
  if(!p.mode){ // tarefa antigo sem modo: grava o modo inferido para consertar
    const inferred=isMonthly?'mensal':'semanal';
    sb.from('projects').update({mode:inferred}).eq('id',p.id);
    p.mode=inferred;
  }
  const { data:items } = await sb.from('items').select('*').eq('project_id',projectId).order('sort');
  S._items=items||[];
  const link=projectLinkFor(c,p);
  const modeChip = isMonthly?'<span class="chip chip-accent">🗓️ Mensal</span>':isProject?'<span class="chip chip-accent">📦 Projeto</span>':p.mode==='pauta_mensal'?'<span class="chip chip-ink">🗞️ Pauta mensal</span>':'<span class="chip chip-ink">📸 Semanal</span>';

  const head=`
    <div class="page-head"><div>
      <div class="crumb"><a onclick="nav('clients')">Clientes</a> / <a onclick="renderClientPage('${c.id}')">${esc(c.name)}</a> / <b>${esc(p.title)}</b></div>
      <h2>${esc(p.title)}</h2>
      <p>${modeChip} <span class="chip chip-ink">${esc(p.kind)}</span> ${esc(p.period||'')} · ${(items||[]).length} ${isProject?'itens':isMonthly?'linhas':'itens'}</p></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="editProject('${p.id}')">Editar dados</button>
        <button class="btn btn-ghost" style="color:var(--red);border-color:var(--red-line)" onclick="delProject('${p.id}','${c.id}')">🗑 Excluir</button>
        <button class="btn btn-ghost" onclick="renderTracking('${p.id}')">📊 Respostas</button>
        ${p.published?`<button class="btn btn-primary" onclick="togglePublish('${p.id}',true)">✓ Publicado</button>`
          :`<button class="btn btn-ghost" onclick="togglePublish('${p.id}',false)">🚀 Publicar</button>`}
        <button class="btn btn-accent" onclick="enviarAoCliente('${p.id}')">📤 Enviar ao cliente</button></div></div>
    ${p.published?`<div class="tcard" style="padding:14px 17px;margin-bottom:8px;display:flex;align-items:center;gap:13px;flex-wrap:wrap">
        <span style="font-weight:700;font-size:13px">🔗 Link desta tarefa:</span>
        <div class="link-box" style="flex:1;min-width:240px"><code>${esc(link)}</code></div>
        <button class="btn btn-accent btn-sm" onclick="enviarAoCliente('${p.id}')">📤 Enviar ao cliente</button>
        <button class="btn btn-ghost btn-sm" onclick="copyText('${esc(link)}','Link copiado!')">Copiar</button></div>
      <p class="hint" style="margin:-4px 0 8px">Esse link abre só esta tarefa, sem misturar com as outras do cliente.</p>`:''}`;

  if(isMonthly){ return shell(head + monthlyEditorBody(p,items||[])); }
  if(isProject){ return shell(head + projectEditorBody(p,items||[])); }
  if(p.mode==='pauta_mensal'){ return shell(head + monthlyPautaEditorBody(p,items||[])); }

  // ----- SEMANAL (posts com copy/criativo) -----
  const ids=(items||[]).map(i=>i.id);
  let decs=[]; if(ids.length){ const r=await sb.from('decisions').select('*').in('item_id',ids); decs=r.data||[]; }
  const decMap={}; decs.forEach(d=>decMap[d.item_id+'-'+d.kind]=d);
  S._decMap=decMap;
  const cell=(need,d)=> !need?'<span class="chip chip-ink">—</span>'
    : d&&d.status==='approved'?'<span class="sb approved">✓</span>'
    : d&&d.status==='rejected'?'<span class="sb rejected">✕</span>':'<span class="sb pending">○</span>';
  const scheduleRows=(items&&items.length)?items.map((it,i)=>`<tr>
      <td><span class="pnum">${i+1}</span></td>
      <td><strong>${esc(it.title||'(sem título)')}</strong></td>
      <td>${(it.platforms||[]).map(x=>`<span class="chip chip-accent">${esc(x)}</span>`).join(' ')||'<span class="chip chip-ink">—</span>'} ${it.format?`<span class="chip chip-ink">${esc(it.format)}</span>`:''}</td>
      <td>${cell(it.has_copy,decMap[it.id+'-copy'])}</td>
      <td>${cell(it.has_creative,decMap[it.id+'-creative'])}</td></tr>`).join('')
    : `<tr><td colspan="5" style="text-align:center;color:var(--ink-faint);padding:28px">Nenhum item ainda.</td></tr>`;
  const itemsEd=(items||[]).map((it,i)=>itemEditorHTML(it,i)).join('');

    <div class="secbar"><div class="ico">📅</div><h3>Tarefa</h3></div>

  shell(body);
}

/* ---------- editor MENSAL (planejamento) ---------- */
const FORMATS=['Estático','Carrossel','Reels','Story'];
function monthlyEditorBody(p,items){
  // items vêm ordenados por sort; agrupa: cada 'week' inicia um grupo, 'post' pertence à semana anterior
  let html='', curWeek=null, weekPosts=[];
  const flush=()=>{
    if(!curWeek) return;
    html+=weekBlockHTML(curWeek, weekPosts, p.id);
    weekPosts=[];
  };
  items.forEach(it=>{
    if(it.row_type==='week'){ flush(); curWeek=it; }
    else { weekPosts.push(it); }
  });
  flush();

async function addWeek(pid){
  const sort=(S._items.length?Math.max(...S._items.map(i=>i.sort||0))+1:0);
  const weekNum=S._items.filter(i=>i.row_type==='week').length+1;
  const rec={ project_id:pid, row_type:'week', title:'Semana '+weekNum, has_copy:false, has_creative:false, sort };
  const { error }=await sb.from('items').insert(rec);
  if(error){ console.error(error); return toast('Erro ao criar semana'); }
  renderProject(pid);
}
async function addPost(pid, weekId){
  // novo post entra logo após o último item da semana (mantém agrupamento por sort)
  const week=S._items.find(i=>i.id===weekId);
  // acha o maior sort entre a semana e seus posts até a próxima semana
  const sorted=S._items.slice().sort((a,b)=>(a.sort||0)-(b.sort||0));
  const wIdx=sorted.findIndex(i=>i.id===weekId);
  let insertSort=(week.sort||0)+1;
  for(let k=wIdx+1;k<sorted.length;k++){ if(sorted[k].row_type==='week') break; insertSort=(sorted[k].sort||0)+1; }
  // abre espaço: empurra itens com sort >= insertSort
  for(const it of S._items){ if((it.sort||0)>=insertSort){ await sb.from('items').update({sort:(it.sort||0)+1}).eq('id',it.id); } }
  const rec={ project_id:pid, row_type:'post', title:'', description:'', format:'Estático', post_date:'', has_copy:false, has_creative:false, sort:insertSort };
  const { error }=await sb.from('items').insert(rec);
  if(error){ console.error(error); return toast('Erro ao adicionar post'); }
  renderProject(pid);
}
function delWeek(weekId){
  // descobre os posts da semana (entre ela e a próxima semana) para excluir junto
  const sorted=S._items.slice().sort((a,b)=>(a.sort||0)-(b.sort||0));
  const wIdx=sorted.findIndex(i=>i.id===weekId);
  const toDel=[weekId];
  for(let k=wIdx+1;k<sorted.length;k++){ if(sorted[k].row_type==='week') break; toDel.push(sorted[k].id); }
  confirmDialog('Excluir semana?',`Remove esta semana e <b>${toDel.length-1} post(s)</b> dentro dela.`,async()=>{
    const paths=[]; const seen=new Set();
    for(const id of toDel){ const it=S._items.find(x=>x.id===id); if(it){ for(const m of creativeList(it)){ const pth=storagePathFromUrl(m.url); if(pth&&!seen.has(pth)){ seen.add(pth); paths.push(pth); } } } }
    if(paths.length){ try{ await sb.storage.from(CFG.bucket).remove(paths); }catch(e){ console.error(e); } }
    for(const id of toDel){ await sb.from('items').delete().eq('id',id); }
    renderProject(S.projectId);
  },true);
}

/* ---------- mutações de item ---------- */
async function upd(id,field,val){
  const rec={}; rec[field]=val;
  const it=S._items.find(x=>x.id===id); if(it) it[field]=val;
  const { error }=await sb.from('items').update(rec).eq('id',id);
  if(error){ console.error(error); toast('Erro ao salvar'); }
}
async function togglePlat(id,pl){
  const it=S._items.find(x=>x.id===id); if(!it)return;
  it.platforms=it.platforms||[]; const i=it.platforms.indexOf(pl);
  if(i>=0) it.platforms.splice(i,1); else it.platforms.push(pl);
  await sb.from('items').update({platforms:it.platforms}).eq('id',id);
  renderProject(S.projectId);
}
async function addItem(pid){
  const sort=(S._items.length?Math.max(...S._items.map(i=>i.sort||0))+1:0);
  const rec={ project_id:pid, title:'', platforms:['Instagram Feed'], format:'', angle:'', has_copy:true, has_creative:true, copy:'', hashtags:'', creative_url:null, sort };
  const { error }=await sb.from('items').insert(rec);
  if(error){ console.error(error); return toast('Erro ao adicionar'); }
  await renderProject(pid);
  setTimeout(()=>{ const els=document.querySelectorAll('.item-ed'); const last=els[els.length-1]; if(last&&last.scrollIntoView)last.scrollIntoView({behavior:'smooth',block:'center'}); },90);
}
function delItem(id){
  confirmDialog('Excluir item?','O item e suas respostas serão removidos.',async()=>{
    const it=S._items.find(x=>x.id===id);
    if(it){ const paths=creativeList(it).map(m=>storagePathFromUrl(m.url)).filter(Boolean); if(paths.length){ try{ await sb.storage.from(CFG.bucket).remove(paths); }catch(e){ console.error(e); } } }
    await sb.from('items').delete().eq('id',id); renderProject(S.projectId);
  },true);
}
function delProject(id,clientId){
  const p=S.projects.find(x=>x.id===id);
  confirmDialog('Excluir tarefa?',`Remove <b>"${esc(p?p.title:'')}"</b> e todos os itens e respostas dele. Não pode ser desfeito.`,async()=>{
    const { data:its }=await sb.from('items').select('creative_url,creative_urls').eq('project_id',id);
    const paths=[]; const seen=new Set();
    for(const it of (its||[])){ for(const m of creativeList(it)){ const pth=storagePathFromUrl(m.url); if(pth&&!seen.has(pth)){ seen.add(pth); paths.push(pth); } } }
    if(paths.length){ try{ await sb.storage.from(CFG.bucket).remove(paths); }catch(e){ console.error(e); } }
    const { error }=await sb.from('projects').delete().eq('id',id);
    if(error){ console.error(error); return toast('Erro ao excluir'); }
    toast('Tarefa excluída'); renderClientPage(clientId);
  },true);
}

  if(error && ((error.message||'').includes('creative_urls')||error.code==='PGRST204')){
    await sb.from('items').update({creative_url:null,creative_type:null}).eq('id',id);
  }
  renderProject(S.projectId);
}

/* lista de mídias do item (suporta carrossel via creative_urls, com fallback pro creative_url único antigo) */
function creativeList(it){
  if(!it) return [];
  let arr=it.creative_urls;
  if(typeof arr==='string'){ try{ arr=JSON.parse(arr); }catch(e){ arr=null; } }
  if(Array.isArray(arr)&&arr.length) return arr;
  return it.creative_url?[{url:it.creative_url,type:it.creative_type||(isVideoCreative(it)?'video':'image')}]:[];
}

/* upload p/ Supabase Storage — aceita vários arquivos de uma vez (carrossel) */
async function uploadImg(id,input){
  const files=input.files?Array.from(input.files):[];
  if(!files.length) return;
  toast(files.length>1?`Enviando ${files.length} arquivos…`:'Enviando…');
  const results=[];
  for(const f of files){
    const isVideo=f.type.startsWith('video/');
    const isImage=f.type.startsWith('image/');
    if(!isVideo&&!isImage){ toast('Arquivo ignorado (formato não suportado): '+f.name); continue; }
    if(isVideo){
      const MB=f.size/1048576;
      if(MB>50){ toast('Vídeo "'+f.name+'" tem '+MB.toFixed(0)+'MB e excede 50MB — ignorado. Hospede em outro lugar e cole a URL.'); continue; }
      const ext=(f.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'')||'mp4';
      const path=S.projectId+'/'+id+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.'+ext;
      const { error }=await sb.storage.from(CFG.bucket).upload(path,f,{contentType:f.type,upsert:true});
      if(error){ console.error(error); toast('Erro no upload de '+f.name); continue; }
      const { data:pub }=sb.storage.from(CFG.bucket).getPublicUrl(path);
      results.push({url:pub.publicUrl,type:'video'});
    } else {
      const blob=await new Promise((resolve)=>{
        const r=new FileReader();
        r.onload=e=>{
          const img=new Image();
          img.onload=()=>{
            const maxW=1400; let w=img.width,h=img.height;
            if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
            const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
            cv.getContext('2d').drawImage(img,0,0,w,h);
            cv.toBlob(b=>resolve(b),'image/jpeg',0.85);
          };
          img.onerror=()=>resolve(null);
          img.src=e.target.result;
        };
        r.onerror=()=>resolve(null);
        r.readAsDataURL(f);
      });
      if(!blob){ toast('Falha ao processar '+f.name); continue; }
      const path=S.projectId+'/'+id+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)+'.jpg';
      const { error }=await sb.storage.from(CFG.bucket).upload(path,blob,{contentType:'image/jpeg',upsert:true});
      if(error){ console.error(error); toast('Erro no upload de '+f.name); continue; }
      const { data:pub }=sb.storage.from(CFG.bucket).getPublicUrl(path);
      results.push({url:pub.publicUrl,type:'image'});
    }
  }
  if(!results.length) return;
  const it=S._items.find(x=>x.id===id);
  const merged=creativeList(it).concat(results);
  const first=merged[0];
  const { error:e2 }=await sb.from('items').update({creative_urls:merged,creative_url:first.url,creative_type:first.type,media_cleared:false}).eq('id',id);
  if(e2 && ((e2.message||'').includes('creative_urls')||e2.code==='PGRST204')){
    toast('Falta criar a coluna creative_urls no banco (veja instruções) — salvando só a primeira imagem por enquanto.');
    await sb.from('items').update({creative_url:first.url,creative_type:first.type,media_cleared:false}).eq('id',id);
  } else if(e2){ console.error(e2); return toast('Erro ao salvar'); }
  renderProject(S.projectId);
  toast(results.length>1?`${results.length} arquivos adicionados`:'Arquivo adicionado');
}
/* detecta se a URL é vídeo (por extensão) quando creative_type não está definido */
function isVideoCreative(it){
  if(it.creative_type) return it.creative_type==='video';
  const u=(it.creative_url||'').toLowerCase().split('?')[0];
  return /\.(mp4|mov|webm|m4v|ogg)$/.test(u);
}
function openLightbox(url,isVideo){
  closeLightbox();
  const ov=document.createElement('div');
  ov.id='lightbox';
  ov.style.cssText='position:fixed;inset:0;background:rgba(10,10,12,.94);z-index:999;display:flex;align-items:center;justify-content:center;padding:24px;cursor:zoom-out';
  ov.innerHTML = isVideo
    ? `<video src="${esc(url)}" controls autoplay playsinline style="max-width:94vw;max-height:94vh;border-radius:6px" onclick="event.stopPropagation()"></video>`
    : `<img src="${esc(url)}" style="max-width:94vw;max-height:94vh;border-radius:6px;object-fit:contain" onclick="event.stopPropagation()">`;
  ov.addEventListener('click',closeLightbox);
  document.addEventListener('keydown',_lbEsc);
  document.body.appendChild(ov);
}
function closeLightbox(){ const el=$('lightbox'); if(el){ el.remove(); document.removeEventListener('keydown',_lbEsc); } }
function _lbEsc(e){ if(e.key==='Escape') closeLightbox(); }
function creativeMediaHTML(it){
  const list=creativeList(it); if(!list.length) return '';
  const one=(m)=> m.type==='video'
    ? `<video src="${esc(m.url)}" controls playsinline style="width:100%;max-height:360px;display:block;background:#000"></video>`
    : `<img src="${esc(m.url)}" onclick="openLightbox(this.src,false)" style="width:100%;display:block;cursor:zoom-in">`;
  if(list.length===1) return one(list[0]);
  return `<div style="width:100%;display:flex;flex-direction:column">
    <div style="display:flex;gap:8px;overflow-x:auto;padding:12px">${list.map(m=>m.type==='video'
      ? `<video src="${esc(m.url)}" controls playsinline style="height:320px;border-radius:8px;flex-shrink:0;background:#000;display:block"></video>`
      : `<img src="${esc(m.url)}" onclick="openLightbox(this.src,false)" style="height:320px;border-radius:8px;flex-shrink:0;display:block;cursor:zoom-in">`).join('')}</div>
    <div style="text-align:center;font-size:11.5px;color:rgba(255,255,255,.55);padding:4px 0 8px">🖼️ Carrossel · ${list.length} mídias — arraste para o lado, toque para ampliar</div>

}
function creativeEmptyHTML(it,fallback){

/* ====================================================================
   FINALIZAR TAREFA · apaga as mídias do Storage p/ liberar espaço
   (mantém texto/histórico; só remove o ARQUIVO de imagem/vídeo)
   ==================================================================== */
function storagePathFromUrl(url){
  if(!url) return null;
  const marker='/object/public/'+CFG.bucket+'/';
  const i=url.indexOf(marker);
  if(i===-1) return null;
  try{ return decodeURIComponent(url.slice(i+marker.length).split('?')[0]); }catch(e){ return url.slice(i+marker.length).split('?')[0]; }
}
function finalizeAndClean(pid){
  const p=S.projects.find(x=>x.id===pid); if(!p) return;
  if(p.media_cleared_at){
    return confirmDialog('Verificar mídias novas?',
      `As mídias desta tarefa já foram apagadas em <b>${esc(new Date(p.media_cleared_at).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}))}</b>. Rodar de novo só remove arquivos de itens que tenham recebido um anexo novo desde então. Continuar?`,
      ()=>runFinalizeAndClean(pid));
  }
  confirmDialog('Finalizar e apagar mídias do Storage?',
    `Isso apaga do <b>Supabase Storage</b> as imagens/vídeos de todos os itens desta tarefa (aprovados e reprovados) para liberar espaço. Textos, comentários e o histórico de aprovação continuam salvos — só o arquivo de mídia é removido, e não pode ser recuperado depois.<br><br>⚠️ Confirme antes que a equipe já <b>baixou ou publicou</b> os criativos aprovados.`,
    ()=>runFinalizeAndClean(pid), true);
}
async function runFinalizeAndClean(pid){
  const { data:its, error:e0 } = await sb.from('items').select('id,creative_url,creative_urls').eq('project_id',pid);
  if(e0){ console.error(e0); return toast('Erro ao buscar itens'); }
  const list=(its||[]).filter(i=>i.creative_url || (creativeList(i).length));
  const seen=new Set(); const paths=[];
  for(const it of list){ for(const m of creativeList(it)){ const p=storagePathFromUrl(m.url); if(p&&!seen.has(p)){ seen.add(p); paths.push(p); } } }
  if(paths.length){
    const { error }=await sb.storage.from(CFG.bucket).remove(paths);
    if(error){ console.error(error); return toast('Erro ao apagar arquivos: '+error.message); }
  }
  for(const it of list){
    const { error }=await sb.from('items').update({creative_url:null,creative_type:null,creative_urls:[],media_cleared:true}).eq('id',it.id);
    if(error && !((error.message||'').includes('media_cleared')||(error.message||'').includes('creative_urls')||error.code==='PGRST204')){ console.error(error); }
  }
  const { error:e1 }=await sb.from('projects').update({media_cleared_at:new Date().toISOString()}).eq('id',pid);
  if(e1 && ((e1.message||'').includes('media_cleared_at')||e1.code==='PGRST204')){
    toast('Arquivos apagados, mas falta criar as colunas media_cleared/media_cleared_at no banco (veja instruções).');
  } else {
    toast(paths.length?`${paths.length} arquivo(s) apagado(s) do Storage`:'Nenhuma mídia para apagar');
  }
  drawTracking(pid);
}

function fmtBytes(b){ if(b<1024)return b+' B'; if(b<1048576)return (b/1024).toFixed(0)+' KB'; if(b<1073741824)return (b/1048576).toFixed(1)+' MB'; return (b/1073741824).toFixed(2)+' GB'; }
async function listBucketFiles(prefix){
  // lista recursiva: pastas (clientes/projetos) e arquivos
  let all=[];
  const { data, error } = await sb.storage.from(CFG.bucket).list(prefix,{limit:1000});
  if(error||!data) return all;
  for(const entry of data){
    const path=prefix?prefix+'/'+entry.name:entry.name;
    if(entry.id===null || (entry.metadata==null && !/\.[a-z0-9]+$/i.test(entry.name))){
      // é uma "pasta" — desce
      const sub=await listBucketFiles(path);
      all=all.concat(sub);
    } else {
      const size=(entry.metadata&&entry.metadata.size)||0;
      all.push({ path, size });
    }
  }
  return all;
}
async function renderStorage(){
  S.view='storage';
  shell(`<div class="loading"><div class="spin"></div><p>Calculando uso de armazenamento…</p></div>`);
  if(!await loadAll()) return;
  let files=[];
  try{ files=await listBucketFiles(''); }catch(e){ console.error(e); }
  const totalBytes=files.reduce((s,f)=>s+(f.size||0),0);
  const LIMIT=1073741824; // 1 GB
  const pct=Math.min(100, Math.round(totalBytes/LIMIT*1000)/10);
  const livre=Math.max(0, LIMIT-totalBytes);
  const barColor = pct<70?'var(--green)':pct<90?'var(--amber-dot)':'var(--red)';

  // contagens gerais
  const nClients=S.clients.length, nProj=S.projects.length;
  const { data:allItems } = await sb.from('items').select('id,row_type,creative_url,creative_urls');
  const nPosts=(allItems||[]).filter(i=>i.row_type!=='week').length;

  // detecta arquivos órfãos: existem no bucket mas não estão mais referenciados por nenhum item
  // (sobras de imagens/vídeos substituídos, itens excluídos ou tarefas excluídas)
  const referenced=new Set();
  for(const it of (allItems||[])){ for(const m of creativeList(it)){ const pth=storagePathFromUrl(m.url); if(pth) referenced.add(pth); } }
  const orphanFiles=files.filter(f=>!referenced.has(f.path));
  const orphanBytes=orphanFiles.reduce((s,f)=>s+(f.size||0),0);

  const body=`
    <div class="page-head"><div><h2>Armazenamento</h2><p>Acompanhe o uso de arquivos (imagens e vídeos dos criativos).</p></div>
      <button class="btn btn-ghost" onclick="renderStorage()">↻ Atualizar</button></div>

    <div class="tcard" style="padding:24px;max-width:620px;margin-bottom:16px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px">
        <div style="font-size:15px;font-weight:700">Uso do armazenamento</div>
        <div style="font-size:13px;color:var(--ink-soft)">${pct}% de 1 GB</div></div>
      <div style="height:14px;background:var(--line-soft);border-radius:20px;overflow:hidden;margin-bottom:12px">
        <div style="height:100%;width:${pct}%;background:${barColor};border-radius:20px;transition:width .4s"></div></div>
      <div style="display:flex;gap:24px;flex-wrap:wrap">
        <div><div style="font-size:24px;font-weight:800">${fmtBytes(totalBytes)}</div><div style="font-size:12px;color:var(--ink-faint)">usados</div></div>
        <div><div style="font-size:24px;font-weight:800;color:var(--green)">${fmtBytes(livre)}</div><div style="font-size:12px;color:var(--ink-faint)">disponíveis</div></div>
        <div><div style="font-size:24px;font-weight:800">${files.length}</div><div style="font-size:12px;color:var(--ink-faint)">arquivos</div></div>
      </div>
      ${pct>=90?`<div style="margin-top:16px;padding:12px 14px;background:var(--red-bg);border-radius:10px;font-size:13px;color:var(--red)">⚠️ Armazenamento quase cheio. Considere apagar criativos antigos já aprovados, ou usar links externos (Drive/YouTube) para vídeos novos.</div>`:pct>=70?`<div style="margin-top:16px;padding:12px 14px;background:var(--amber-bg,#FEF3C7);border-radius:10px;font-size:13px;color:#92660A">Atenção: você já usou mais de 70% do espaço. Vídeos são o que mais ocupam.</div>`:''}
      ${orphanFiles.length?`<div style="margin-top:16px;padding:12px 14px;background:var(--accent-tint);border-radius:10px;font-size:13px;color:var(--accent-deep);display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <span style="flex:1">🧹 <b>${orphanFiles.length} arquivo(s) órfão(s)</b> (${fmtBytes(orphanBytes)}) — sobras de imagens/vídeos substituídos ou itens/tarefas excluídos antes desta correção, sem uso em nenhum criativo atual.</span>
        <button class="btn btn-accent btn-sm" onclick="cleanOrphanFiles()">Limpar agora</button></div>`:''}
    </div>

    <div class="tcard" style="padding:20px 24px;max-width:620px;margin-bottom:16px">
      <div style="font-size:13.5px;font-weight:700;margin-bottom:12px">Resumo da conta</div>
      <div style="display:flex;gap:28px;flex-wrap:wrap">
        <div><div style="font-size:20px;font-weight:800">${nClients}</div><div style="font-size:12px;color:var(--ink-faint)">clientes</div></div>
        <div><div style="font-size:20px;font-weight:800">${nProj}</div><div style="font-size:12px;color:var(--ink-faint)">tarefas</div></div>
        <div><div style="font-size:20px;font-weight:800">${nPosts}</div><div style="font-size:12px;color:var(--ink-faint)">posts</div></div>
      </div>
      <p class="hint" style="margin-top:14px">Os textos (tarefas, temas, descrições, comentários) praticamente não ocupam espaço — o limite que importa é o de arquivos acima.</p>
    </div>`;
  shell(body);
}

async function cleanOrphanFiles(){
  toast('Procurando arquivos órfãos…');
  let files=[]; try{ files=await listBucketFiles(''); }catch(e){ console.error(e); return toast('Erro ao listar arquivos'); }
  const { data:allItems } = await sb.from('items').select('creative_url,creative_urls');
  const referenced=new Set();
  for(const it of (allItems||[])){ for(const m of creativeList(it)){ const pth=storagePathFromUrl(m.url); if(pth) referenced.add(pth); } }
  const orphans=files.filter(f=>!referenced.has(f.path));
  if(!orphans.length) return toast('Nenhum arquivo órfão encontrado.');
  const totalSize=orphans.reduce((s,f)=>s+(f.size||0),0);
  confirmDialog('Limpar arquivos órfãos?',
    `Encontrei <b>${orphans.length} arquivo(s)</b> (${fmtBytes(totalSize)}) no Storage que não estão mais vinculados a nenhum item — sobraram de imagens/vídeos substituídos ou de itens/tarefas excluídos antes desta correção.<br><br>Apagar libera esse espaço e <b>não afeta</b> nenhum criativo em uso hoje. Não pode ser desfeito.`,
    async()=>{
      const paths=orphans.map(f=>f.path);
      let okCount=0;
      for(let i=0;i<paths.length;i+=100){
        const chunk=paths.slice(i,i+100);
        const { error }=await sb.storage.from(CFG.bucket).remove(chunk);
        if(error){ console.error(error); toast('Erro ao apagar alguns arquivos: '+error.message); }
        else okCount+=chunk.length;
      }
      toast(`${okCount} arquivo(s) órfão(s) apagado(s)`);
      renderStorage();
    },true);
}

function uploadLogo(input){
  const f=input.files&&input.files[0]; if(!f)return;
  if(!f.type.startsWith('image/')) return toast('Selecione uma imagem');
  const r=new FileReader();
  r.onload=e=>{ const img=new Image();
    img.onload=()=>{ const sz=256; const cv=document.createElement('canvas'); cv.width=sz; cv.height=sz;
      const ctx=cv.getContext('2d');
      // recorte central quadrado
      const m=Math.min(img.width,img.height); const sx=(img.width-m)/2, sy=(img.height-m)/2;
      ctx.drawImage(img,sx,sy,m,m,0,0,sz,sz);
      let data=cv.toDataURL('image/jpeg',0.85);
      if(data.length>180000) data=cv.toDataURL('image/jpeg',0.6);
      S._logoTmp=data;
      const prev=$('logoPrev'); if(prev) prev.innerHTML=`<img src="${data}" style="width:100%;height:100%;object-fit:cover">`;
      toast('Foto carregada — clique em Salvar');
    };
    img.src=e.target.result; };
  r.readAsDataURL(f);
}
function removeLogo(){ S._logoTmp=''; const prev=$('logoPrev'); if(prev) prev.innerHTML=esc(($('stDisplay')&&$('stDisplay').value||$('stName')&&$('stName').value||'P').slice(0,2).toUpperCase()); toast('Logo removida — clique em Salvar'); }
async function saveSettings(){
  const rec={ id:1, name:$('stName').value.trim(), display_name:$('stDisplay').value.trim(), whatsapp:$('stWa').value.trim(), email:$('stEmail').value.trim(), logo:S._logoTmp||null };

  CFG.agencyName=rec.name; S.agency=rec; toast('Configurações salvas');

}

// Desligado por enquanto: os botões de ativar avisos ficam escondidos. Para religar, troque para true.
const AVISOS_LIGADOS = true;
const pushSuportado = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
function base64ParaBytes(b64){ const p='='.repeat((4-b64.length%4)%4); const r=atob((b64+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(r,ch=>ch.charCodeAt(0)); }
async function chamarAvisos(body){
  const { data, error } = await sb.functions.invoke('avisos', { body });
  if(error){ let msg=error.message; try{ msg=(await error.context.json()).erro||msg; }catch(_){} throw new Error(msg); }
  return data;
}
// a marca de "avisos ativados" é separada para equipe e para cada cliente (o mesmo aparelho pode ser os dois)
const marcaAvisos = () => MODE==='client' ? 'aprova_avisos_cli_'+clientToken : 'aprova_avisos_equipe';
function avisosAtivos(){ return pushSuportado() && Notification.permission==='granted' && lerLocal(marcaAvisos())==='1'; }
async function ativarAvisos(btn){
  if(ehIphone() && !emApp()) return guiaIphone(true);   // no iPhone, só pelo ícone na tela de início
  if(!pushSuportado()){
    return toast(ehIphone() ? 'Atualize o iPhone (iOS 16.4 ou mais novo) para receber avisos' : 'Este navegador não recebe notificações');
  }
  if(Notification.permission==='denied'){
    return toast('Notificações bloqueadas. Toque no ícone ao lado do endereço → Permissões → Notificações → Permitir, e tente de novo.');
  }
  const rotulo=btn?btn.innerHTML:''; if(btn){ btn.disabled=true; btn.textContent='Ativando…'; }
  try{
    const perm=await Notification.requestPermission();
    if(perm!=='granted') throw new Error('Notificações bloqueadas. Toque no ícone ao lado do endereço → Permissões → Notificações → Permitir, e tente de novo.');
    const reg=await navigator.serviceWorker.register('sw.js');
    await navigator.serviceWorker.ready;
    const { chave }=await chamarAvisos({ acao:'chave' });
    let ins=await reg.pushManager.getSubscription();
    if(!ins) ins=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:base64ParaBytes(chave) });
    await chamarAvisos({ acao:'inscrever', inscricao:ins.toJSON(), token:MODE==='client'?clientToken:undefined });
    gravarLocal(marcaAvisos(),'1');
    toast('🔔 Avisos ativados neste aparelho!');
    document.querySelectorAll('.avisos-card').forEach(el=>el.remove());
    const sb2=$('btnAvisosEquipe'); if(sb2) sb2.outerHTML=botaoAvisosEquipe();
  }catch(e){
    console.error(e); toast('❌ '+(e.message||'Não foi possível ativar os avisos'));
    if(btn){ btn.disabled=false; btn.innerHTML=rotulo; }
  }
}

if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); _instPrompt = e; });
const emApp = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const ehIphone = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
const ehSamsung = () => /SamsungBrowser/i.test(navigator.userAgent);
// navegador embutido do WhatsApp/Instagram/Facebook: não deixa instalar, precisa abrir no navegador
const ehNavegadorDeApp = () => /WhatsApp|Instagram|FBAN|FBAV|FB_IAB|; wv\)/i.test(navigator.userAgent);
function lerLocal(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function gravarLocal(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function prepararAppCliente(c){
  // guarda o link geral do cliente (sem /p/tarefa): o app sempre abre na tarefa mais recente
  gravarLocal('aprova_link_cliente', location.origin+location.pathname+'#/c/'+clientToken);

const tarefaAprovada = (pr) => !!pr.month_ts;

function barraStatusHTML(c){
  const pub=(S.cProjects||[]).filter(x=>x.published);
  const nPend=pub.filter(x=>!tarefaAprovada(x)).length, nOk=pub.length-nPend;
  const bt=(f,txt,n)=>`<button class="st-btn ${S.cFiltro===f?'on':''}" style="${S.cFiltro===f?`background:${c.color};border-color:${c.color}`:''}" onclick="filtrarTarefas('${f}')">${txt} <span>${n}</span></button>`;

async function loadClientView(){
  const c=S.cClient;
  prepararAppCliente(c);
  const { data:projects } = await sb.from('projects').select('*').eq('client_id',c.id).order('created_at',{ascending:false});
  S.cProjects=projects||[];
  if(!S.cProjects.length){
    $('app').innerHTML=clientHeader(c)+`<div class="c-wrap"><div class="empty"><div class="em">📭</div><h3>Nada por aqui ainda</h3><p>Assim que a ${esc(CFG.agencyName)} publicar uma tarefa, ele aparece aqui para sua aprovação.</p></div></div>`;
    return;
  }
  const focus=S.cFocusProject && S.cProjects.find(x=>x.id===S.cFocusProject && x.published);
  S.cFiltro = focus ? (tarefaAprovada(focus)?'ok':'pend') : (S.cFiltro||'pend');

  // marca o envio no projeto (pra agência ver que foi finalizado)

    groupsHTML+=`<div style="margin-bottom:24px">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div class="ico" style="width:32px;height:32px;border-radius:9px;background:${accent};color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px">🗂️</div>
        <h3 style="font-size:17px;font-weight:700">${esc(curWeek.title||curWeek.week||'Semana')}</h3>
        <span class="chip chip-ink">${wPosts.length} post${wPosts.length!==1?'s':''}</span></div>
      ${postsHTML||'<p style="font-size:13px;color:var(--ink-faint);margin-bottom:14px">Sem posts nesta semana.</p>'}</div>`;
    wPosts=[];
  };
  items.forEach(it=>{ if(it.row_type==='week'){ flushG(); curWeek=it; } else { wPosts.push(it); totalPosts++; } });
  flushG();

  document.querySelector('.c-wrap').innerHTML=`
    ${picker}
    <div class="secbar"><div class="ico" style="background:${accent}">🗓️</div><h3>Planejamento do mês</h3></div>
    <p style="font-size:13.5px;color:var(--ink-soft);margin:-6px 0 18px">Veja o planejamento do mês, semana a semana. Em cada post, aprove ou reprove e, se quiser, deixe um comentário.</p>
    ${groupsHTML||'<div class="empty"><p>Planejamento ainda em montagem.</p></div>'}
    <p style="font-size:12.5px;color:var(--ink-faint);text-align:right;margin:4px 0 20px">Total: <b>${totalPosts} posts</b> no mês</p>

    <div class="send-block"><div class="send-inner">
      <div class="si">📤</div><h2>Finalizar</h2>
      <p>Suas respostas e comentários são salvos automaticamente. Confirme seu nome e envie para concluir.</p>
      <div class="namewrap"><label>Seu nome</label><input id="cSenderM" placeholder="Quem está avaliando?" value="${esc(p.month_sender||'')}" onchange="S._mSender=this.value"></div>
      <div class="send-btns" style="margin-top:18px">
        <button class="btn btn-plugblue" style="padding:13px 36px;font-size:15px" onclick="finalizarEnvioMes('${p.id}')">✓ Enviar respostas</button>
        <button class="btn btn-wa-outline" style="padding:13px 24px;font-size:14px" onclick="cliWhatsapp()">📲 Resumo no WhatsApp</button>
      </div>
      </div></div>
    <p style="text-align:center;font-size:12px;color:var(--ink-faint);margin-top:22px">plug.aprova · ${esc(CFG.agencyName)}</p>`;
  S._mSender=p.month_sender||'';
}
async function decidePost(itemId,status){
  const it=S.cItems.find(x=>x.id===itemId);
  const jaEra = it&&it.post_status===status;
  // REPROVAR exige comentário de ajuste
  if(status==='rejected' && !jaEra){
    const temNota = it && it.note && it.note.trim();
    if(!temNota){
      askReject(itemId);  // abre popup pedindo o ajuste
      return;
    }
  }
  const novo = jaEra ? null : status; // clicar de novo desmarca
  await applyPostStatus(itemId, novo);
}
async function applyPostStatus(itemId, novo){
  const it=S.cItems.find(x=>x.id===itemId);
  if(it) it.post_status=novo;
  const ap=$('ap-'+itemId), rj=$('rj-'+itemId);
  if(ap) ap.classList.toggle('on',novo==='approved');
  if(rj) rj.classList.toggle('on',novo==='rejected');
  const { error }=await sb.from('items').update({post_status:novo}).eq('id',itemId);
  if(error){
    console.error(error);
    if((error.message||'').includes('post_status')||error.code==='PGRST204'){
      toast('Falta criar a coluna post_status no banco. Avise o suporte.');
    } else { toast('Erro ao salvar. Tente novamente.'); }
  }
}
function askReject(itemId){
  const it=S.cItems.find(x=>x.id===itemId);
  openModal(`
    <div class="modal-head"><h3>✕ Reprovar — qual o ajuste?</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
    <div class="modal-body">
      <p style="font-size:13.5px;color:var(--ink-soft);margin-bottom:12px">Descreva o que precisa ser ajustado neste post. Esse comentário vai junto para a agência.</p>
      <div class="field"><label>Comentário de ajuste</label>
        <textarea id="rejNote" placeholder="Ex.: Trocar a imagem do segundo card, ajustar a data…" style="min-height:90px" autofocus>${esc(it&&it.note||'')}</textarea></div>
    </div>
    <div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn" style="background:var(--red);color:#fff" onclick="confirmReject('${itemId}')">✕ Reprovar com este ajuste</button></div>`);
  setTimeout(()=>{ const t=$('rejNote'); if(t){t.focus();} },60);
}
async function confirmReject(itemId){
  const v=$('rejNote')?$('rejNote').value.trim():'';
  if(!v) return toast('Escreva o ajuste para reprovar');
  const it=S.cItems.find(x=>x.id===itemId);
  if(it) it.note=v;
  // salva o comentário e marca como reprovado
  await sb.from('items').update({note:v}).eq('id',itemId);
  await applyPostStatus(itemId,'rejected');
  avisarAjuste(itemId,'post',itemId);
  closeModal();
  // atualiza o textarea visível do post, se existir
  const card=$('pc-'+itemId); if(card){ const ta=card.querySelector('textarea'); if(ta) ta.value=v; }
  toast('Post reprovado com o ajuste registrado');
}
async function finalizarEnvioMes(pid){
  const nm=$('cSenderM')&&$('cSenderM').value.trim();
  if(!nm) return toast('Por favor, informe seu nome antes de enviar');
  S._mSender=nm;
  // marca quem enviou e quando (o status do mês passa a refletir "respondido")
  const agora=new Date().toISOString();
  await sb.from('projects').update({month_sender:nm, month_ts:agora, month_status:'responded'}).eq('id',pid);
  const pa=S.cProjects.find(x=>x.id===pid); if(pa) pa.month_ts=agora;
  avisarEquipe(pid);
  const sub=document.querySelector('.send-inner');
  if(sub){ sub.innerHTML=`<div class="si">✅</div><h2>Respostas enviadas!</h2><p style="max-width:420px;margin:8px auto 0">Tudo certo, ${esc(nm)}. A ${esc(CFG.agencyName)} já recebeu suas aprovações e comentários. Você pode fechar esta página.</p>`; }
  toast('Respostas enviadas com sucesso!');
}
async function saveMonthNote(itemId,v){
  const it=S.cItems.find(x=>x.id===itemId); if(it) it.note=v;
  const { error }=await sb.from('items').update({note:v}).eq('id',itemId);
  if(error){ console.error(error); toast('Erro ao salvar observação'); }
}
async function decideMonth(pid,val){
  const p=S.cProjects.find(x=>x.id===pid);
  const sender=($('cSenderM')&&$('cSenderM').value.trim())||S._mSender||'';
  // toggle off
  if(p.month_status===val){
    p.month_status=null;
    await sb.from('projects').update({month_status:null,month_sender:sender,month_ts:new Date().toISOString()}).eq('id',pid);
    $('mAp').classList.remove('on'); $('mRj').classList.remove('on');
    $('mStatus').textContent='Aguardando sua avaliação'; $('mStatus').style.color='var(--ink-faint)';
    return;
  }
  p.month_status=val; p.month_sender=sender; p.month_ts=new Date().toISOString();
  const { error }=await sb.from('projects').update({month_status:val,month_sender:sender,month_ts:p.month_ts}).eq('id',pid);
  if(error){ console.error(error); return toast('Erro ao salvar'); }
  $('mAp').classList.toggle('on',val==='approved'); $('mRj').classList.toggle('on',val==='rejected');
  const lbl=val==='approved'?'✓ Mês aprovado':'✕ Revisão solicitada';
  $('mStatus').textContent=lbl+' em '+nowStr(); $('mStatus').style.color=val==='approved'?'var(--green)':'var(--red)';
  toast(val==='approved'?'Mês aprovado!':'Revisão solicitada');
}

function shade(hex){ try{ const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255; r=Math.round(r*.68);g=Math.round(g*.68);b=Math.round(b*.68); return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}catch(e){return hex;} }

function clientProjectCardHTML(it,i,dm,c){
  const accent=c.color; const src=it.creative_url||'';
  const blocks=[];
  if(it.description&&it.description.trim()){
    blocks.push(`<div class="blk"><div class="copy-block" style="border-left-color:${accent};white-space:pre-wrap">${esc(it.description)}</div></div>`);
  }
  if(src){
    blocks.push(`<div class="blk"><div class="blk-label"><span class="chip chip-ink">📎 Anexo</span></div>
      <div class="creative-prev">${creativeMediaHTML(it)}</div></div>`);
  }
  blocks.push(`<div class="blk">${approveBoxHTML(it.id,'creative','Aprovação',dm)}</div>`);
  return `<div class="post-card"><div class="post-head"><span class="pnum" style="background:${accent}">${i+1}</span>
    <div class="pinfo"><h3>${esc(it.title||'Item '+(i+1))}</h3></div></div>${blocks.join('')}</div>`;
}
function clientCardHTML(it,i,dm,c){
  const accent=c.color; const blocks=[];
  if(it.has_creative){ const src=it.creative_url||'';
    blocks.push(`<div class="blk"><div class="blk-label"><span class="chip chip-ink">🎨 Criativo</span></div>
    <div class="creative-prev">${src?creativeMediaHTML(it):creativeEmptyHTML(it,'Criativo em produção. Será incluído quando finalizado.')}</div>
    ${approveBoxHTML(it.id,'creative','Aprovação do Criativo',dm)}</div>`); }
  if(it.has_copy){ blocks.push(`<div class="blk"><div class="blk-label"><span class="chip chip-accent">✍️ Copy</span></div>
    <div class="copy-block" style="border-left-color:${accent}"><p>${esc(it.copy||'(sem texto)')}</p>${it.hashtags?`<p class="tags" style="color:${shade(accent)}">${esc(it.hashtags)}</p>`:''}</div>
    ${approveBoxHTML(it.id,'copy','Aprovação da Copy',dm)}</div>`); }
  return `<div class="post-card"><div class="post-head"><span class="pnum" style="background:${accent}">${i+1}</span>
    <div class="pinfo"><h3>${esc(it.title||'Item '+(i+1))}</h3><p>${(it.platforms||[]).join(' · ')||''}${it.format?' · '+esc(it.format):''}${it.post_date?' · 📅 '+esc(fmtDate(it.post_date)):''}</p></div></div>${blocks.join('')}</div>`;
}
function approveBoxHTML(itemId,type,title,dm){
  const key=itemId+'-'+type; const d=dm[key];
  const cls=d?(d.status==='approved'?'is-approved':'is-rejected'):'';
  return `<div class="approve-box ${cls}" id="box-${key}"><div class="ap-top"><span class="ap-title">${title}</span>
    <button class="b-ap ${d&&d.status==='approved'?'on':''}" onclick="decide('${itemId}','${type}','approved')">✓ Aprovar</button>
    <button class="b-rj ${d&&d.status==='rejected'?'on':''}" onclick="decide('${itemId}','${type}','rejected')">✕ Reprovar</button></div>
    <div class="changefield ${d&&d.status==='rejected'?'show':''}" id="cf-${key}"><label>O que quer alterar?</label>
      <textarea id="nt-${key}" placeholder="Descreva o ajuste…" onchange="saveNote('${key}',this.value)">${d&&d.notes?esc(d.notes):''}</textarea></div>
    <div class="ap-ts ${d?'show':''}" id="ts-${key}">${d?(d.status==='approved'?'Aprovado':'Reprovado')+' em '+esc(new Date(d.updated_at||Date.now()).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})):''}</div></div>`;
}
function drawClientSchedule(){
  const dm=S.cDecisions, items=S.cItems, accent=S.cClient.color;
  const el=$('cSchedule'); if(!el)return;
  el.innerHTML=items.map((it,i)=>{
    const cell=(need,t)=>{ if(!need)return '<span class="chip chip-ink">—</span>'; const d=dm[it.id+'-'+t];
      return !d?'<span class="sb pending">○</span>':d.status==='approved'?'<span class="sb approved">✓</span>':'<span class="sb rejected">✕</span>'; };
    return `<tr><td><span class="pnum" style="background:${accent}">${i+1}</span></td><td><strong>${esc(it.title||'')}</strong></td>
      <td style="font-size:12px">${(it.platforms||[]).join(', ')}</td><td>${cell(it.has_copy,'copy')}</td><td>${cell(it.has_creative,'creative')}</td></tr>`;
  }).join('');
}

async function decide(itemId,type,val){
  const key=itemId+'-'+type; const cur=S.cDecisions[key];
  const box=$('box-'+key), cf=$('cf-'+key), ts=$('ts-'+key);
  const ap=box.querySelector('.b-ap'), rj=box.querySelector('.b-rj');
  // toggle off
  if(cur&&cur.status===val){
    delete S.cDecisions[key];
    ap.classList.remove('on'); rj.classList.remove('on'); box.classList.remove('is-approved','is-rejected');
    cf.classList.remove('show'); ts.classList.remove('show'); ts.textContent='';
    await sb.from('decisions').delete().eq('item_id',itemId).eq('kind',type);
    drawClientSchedule(); updateClientProgress(); return;
  }
  const notes=$('nt-'+key)?$('nt-'+key).value.trim():'';
  const rec={ item_id:itemId, kind:type, status:val, notes:val==='rejected'?notes:'', sender:(S.cSender||$('cSender')&&$('cSender').value.trim()||''), updated_at:new Date().toISOString() };
  S.cDecisions[key]={...rec};
  ap.classList.toggle('on',val==='approved'); rj.classList.toggle('on',val==='rejected');
  box.classList.remove('is-approved','is-rejected'); box.classList.add(val==='approved'?'is-approved':'is-rejected');
  cf.classList.toggle('show',val==='rejected'); if(val==='rejected'&&$('nt-'+key))$('nt-'+key).focus();
  ts.textContent=(val==='approved'?'Aprovado':'Reprovado')+' em '+nowStr(); ts.classList.add('show');
  drawClientSchedule(); updateClientProgress();
  const { error }=await sb.from('decisions').upsert(rec,{onConflict:'item_id,kind'});
  if(error){ console.error(error); toast('Erro ao salvar resposta'); }
}
async function saveNote(key,v){
  if(!S.cDecisions[key])return; S.cDecisions[key].notes=v;
  const it=key.replace(/-(copy|creative)$/,''); const tp=key.endsWith('copy')?'copy':'creative';
  await sb.from('decisions').update({notes:v}).eq('item_id',it).eq('kind',tp);
  if(S.cDecisions[key].status==='rejected' && v.trim()) avisarAjuste(it,tp,key);
}
function saveSender(v){ S.cSender=v; /* salvo junto na próxima decisão; atualiza existentes */ syncSender(v); }
async function syncSender(v){ const keys=Object.keys(S.cDecisions); for(const k of keys){ const it=k.replace(/-(copy|creative)$/,''); const tp=k.endsWith('copy')?'copy':'creative'; await sb.from('decisions').update({sender:v}).eq('item_id',it).eq('kind',tp);} }

function updateClientProgress(){
  let total=0,done=0;
  S.cItems.forEach(it=>{ if(it.has_copy){total++;if(S.cDecisions[it.id+'-copy'])done++;} if(it.has_creative){total++;if(S.cDecisions[it.id+'-creative'])done++;} });
  const pct=total?Math.round(done/total*100):0;
  if($('cFill'))$('cFill').style.width=pct+'%';
  if($('cCount'))$('cCount').textContent=`${done} de ${total} avaliados (${pct}%)`;
  const al=$('cAlert'); if(!al)return; const pend=total-done;
  if(pend>0){ al.classList.add('show'); al.innerHTML=`⚠️ Ainda há <b>&nbsp;${pend} ${pend===1?'item pendente':'itens pendentes'}</b>.`; }
  else al.classList.remove('show');
}
function buildClientText(){
  const c=S.cClient,p=S.cProjects.find(x=>x.id===S.cActiveProj);
  if(p.mode==='mensal'){
    const name=((($('cSenderM')&&$('cSenderM').value)||S._mSender||p.month_sender||'').trim())||'—';
    const mPosts=S.cItems.filter(i=>i.row_type!=='week');
    const mAppr=mPosts.filter(i=>i.post_status==='approved').length;
    const mRej=mPosts.filter(i=>i.post_status==='rejected').length;
    const stt = mPosts.length===0?'⏳ AINDA NÃO AVALIADO'
              : (mAppr+mRej)<mPosts.length?'⏳ EM AVALIAÇÃO'
              : mRej>0?'❌ COM AJUSTES SOLICITADOS'
              : '✅ MÊS APROVADO';
    let t=`🗓️ *APROVAÇÃO DO MÊS — ${c.name}*\n${p.title}${p.period?' ('+p.period+')':''}\nResponsável: ${name}\nStatus: ${stt}\nData: ${nowStr()}\n`;
    S.cItems.forEach((it)=>{
      if(it.row_type==='week'){ t+=`\n${'─'.repeat(34)}\n🗂️ *${it.title||it.week||'Semana'}*\n`; }
      else {
        const ps = it.post_status==='approved'?'✅ APROVADO':it.post_status==='rejected'?'❌ REPROVADO':'⏳ PENDENTE';
        t+=`\n*${it.title||'(tema)'}* — ${ps}\n${it.format||''}${it.post_date?' · '+fmtDate(it.post_date):''}\n`;
        if(it.description&&it.description.trim()) t+=`${it.description.trim()}\n`;
        if(it.note&&it.note.trim()) t+=`\n✏️ *Ajuste pedido:* ${it.note.trim()}\n`;
      }
    });
    t+=`\n${'─'.repeat(34)}\nEnviado via plug.aprova · ${CFG.agencyName}`;
    return t;
  }
  const name=(S.cSender||'').trim()||'—';
  let t=`📋 *APROVAÇÃO DE CONTEÚDO — ${c.name}*\n${p.title}${p.period?' ('+p.period+')':''}\nResponsável: ${name}\nData: ${nowStr()}\n`;
  S.cItems.forEach((it,i)=>{ t+=`\n${'─'.repeat(34)}\n*${i+1}. ${it.title||'Item '+(i+1)}*\n${(it.platforms||[]).join(' · ')||''}${it.format?' · '+it.format:''}\n`;
    if(it.has_copy){ const d=S.cDecisions[it.id+'-copy']; const ic=!d?'⏳ PENDENTE':d.status==='approved'?'✅ APROVADO':'❌ REPROVADO';
      t+=`\n✍️ *Copy* — ${ic}\n${it.copy||'(sem texto)'}\n`; if(it.hashtags)t+=`${it.hashtags}\n`;
      if(d&&d.status==='rejected'&&d.notes)t+=`✏️ *Ajuste pedido:* ${d.notes}\n`; }
    if(it.has_creative){ const d=S.cDecisions[it.id+'-creative']; const ic=!d?'⏳ PENDENTE':d.status==='approved'?'✅ APROVADO':'❌ REPROVADO';
      t+=`\n🎨 *Criativo* — ${ic}\n`; if(it.creative_url)t+=`${it.creative_url}\n`;
      if(d&&d.status==='rejected'&&d.notes)t+=`✏️ *Ajuste pedido:* ${d.notes}\n`; }
  });
  t+=`\n${'─'.repeat(34)}\nEnviado via plug.aprova · ${CFG.agencyName}`;
  return t;
}
async function agencyContact(){ const {data}=await sb.from('agency').select('whatsapp,email').eq('id',1).maybeSingle(); return data||{}; }
async function cliWhatsapp(){ const a=await agencyContact(); const wa=(a.whatsapp||'').replace(/\D/g,''); window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(buildClientText()),'_blank'); }
async function cliEmail(){ const a=await agencyContact(); window.location.href='mailto:'+(a.email||'')+'?subject='+encodeURIComponent('Aprovação — '+S.cClient.name+' · '+(S.cProjects.find(x=>x.id===S.cActiveProj)||{}).title)+'&body='+encodeURIComponent(buildClientText()); }

boot();
</script>
</body>
</html>
